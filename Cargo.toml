[workspace]
resolver = "3"
members = [
  "./server",

  "./clients/tui",
  "./clients/web",

  "./common",
]

[workspace.dependencies]
axum                 = { version = "=0.8.4",   default-features = false }
chrono               = { version = "=0.4.41",  default-features = false }
clap                 = { version = "=4.5.40",  default-features = false }
crossterm            = { version = "=0.29.0",  default-features = false }
dioxus-core          = { version = "=0.6.3",   default-features = false }
dioxus               = { version = "=0.6.3",   default-features = false }
futures-util         = { version = "=0.3.31",  default-features = false }
futures              = { version = "=0.3.31",  default-features = false }
gloo-console         = { version = "=0.3.0",   default-features = false }
gloo-net             = { version = "=0.6.0",   default-features = false }
gloo-timers          = { version = "=0.3.0",   default-features = false }
keyvalues-parser     = { version = "=0.2.0",   default-features = false }
libc                 = { version = "=0.2.175", default-features = false }
log4rs               = { version = "=1.3.0",   default-features = false }
log                  = { version = "=0.4.27",  default-features = false }
nix                  = { version = "=0.30.1",  default-features = false }
rand                 = { version = "=0.9.1",   default-features = false }
ratatui              = { version = "=0.29.0",  default-features = false }
regex                = { version = "=1.11.1",  default-features = false }
rusqlite             = { version = "=0.37.0",  default-features = false }
rustctl-common       = { path    = "./common"                           }
serde_json           = { version = "=1.0.140", default-features = false }
serde                = { version = "=1.0.219", default-features = false }
tokio-tungstenite    = { version = "=0.27.0",  default-features = false }
tokio-util           = { version = "=0.7.15",  default-features = false }
tokio                = { version = "=1.45.1",  default-features = false }
tower-http           = { version = "=0.6.6",   default-features = false }
uuid                 = { version = "=1.17.0",  default-features = false }
wasm-bindgen-futures = { version = "=0.4.50",  default-features = false }
web-sys              = { version = "=0.3.77",  default-features = false }

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
