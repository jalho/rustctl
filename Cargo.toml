[workspace]
resolver = "3"
members = [
  "./mocks/RustDedicated",
  "./mocks/websocket-client-cli",
  "./mocks/steamcmd",
  "./rustctl-backend",
  "./rustctl-common",
  "./rustctl-frontend",
]

[workspace.dependencies]
tokio       = { version = "=1.45.1",  default-features = false }
serde       = { version = "=1.0.219", default-features = false }
chrono      = { version = "=0.4.41",  default-features = false }
uuid        = { version = "=1.17.0",  default-features = false }
dioxus-core = { version = "=0.6.3",   default-features = false }
dioxus      = { version = "=0.6.3",   default-features = false }

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
