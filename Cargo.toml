[workspace]
resolver = "3"
members  = [
  "backend",
  "launcher",
  "xtask",
]

[workspace.package]
edition      = "2024"
rust-version = "1.98.0" # latest stable as of 2026-08-30

[workspace.dependencies]
clap              = { version = "=4.6.6", default-features = false }
tokio             = { version = "=1.53.1", default-features = false, features = [ "rt", "rt-multi-thread", "net", "time", "io-util" ] }
reqwest           = { version = "=0.13.4", default-features = false, features = [ "rustls" ] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = [ "connect", "handshake" ] }
futures-util      = { version = "=0.3.34", default-features = false, features = [ "std", "sink" ] }
serde_json        = { version = "=1.0.151", default-features = false, features = [ "std" ] }
flate2            = { version = "=1.1.10", default-features = false, features = [ "rust_backend" ] }
tar               = { version = "=0.4.46", default-features = false }
