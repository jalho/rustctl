[workspace]
resolver = "3"
members  = [
  "./backend/",
  "./shared/",
  "./xtask/",
]

[workspace.package]
version      = "0.0.1"
rust-version = "1.93" # latest stable as of 2026-02-22

[workspace.dependencies]
axum                 = { version = "=0.8.4",   default-features = false, features = [] }
chrono               = { version = "=0.4.43",  default-features = false, features = [] }
clap                 = { version = "=4.5.51",  default-features = false, features = [] }
futures-util         = { version = "=0.3.31",  default-features = false, features = [] }
libcrux-ml-dsa       = { version = "=0.0.7",   default-features = false, features = [] }
log4rs               = { version = "=1.4.0",   default-features = false, features = [] }
log                  = { version = "=0.4.28",  default-features = false, features = [] }
nix                  = { version = "=0.30.1",  default-features = false, features = [] }
openssl              = { version = "=0.10.75", default-features = false, features = [] }
rand                 = { version = "=0.10.0",  default-features = false, features = [] }
rcgen                = { version = "=0.14.7",  default-features = false, features = [] }
reqwest              = { version = "=0.13.1",  default-features = false, features = [] }
rustls-pki-types     = { version = "=1.14.0",  default-features = false, features = [] }
rustls               = { version = "=0.23.37", default-features = false, features = [] }
serde_json           = { version = "=1.0.149", default-features = false, features = [] }
serde                = { version = "=1.0.228", default-features = false, features = [] }
serde_yaml           = { version = "=0.9.34",  default-features = false, features = [] }
tokio-postgres       = { version = "=0.7.16",  default-features = false, features = [] }
tokio-tungstenite    = { version = "=0.28.0",  default-features = false, features = [] }
tokio                = { version = "=1.48.0",  default-features = false, features = [] }
tower-http           = { version = "=0.6.8",   default-features = false, features = [] }
url                  = { version = "=2.5.8",   default-features = false, features = [] }
uuid                 = { version = "=1.20.0",  default-features = false, features = [] }
webauthn-rs          = { version = "=0.5.4",   default-features = false, features = [] }
