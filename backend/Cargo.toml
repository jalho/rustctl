[package]
edition      = "2024"
name         = "backend"
rust-version = { workspace = true }

[dependencies]
clap   = { workspace = true, default-features = false, features = [ "color", "derive", "error-context", "help", "std", "suggestions", "usage" ] }
log4rs = { workspace = true, default-features = false, features = [ "console_appender" ] }
log    = { workspace = true, features = [] }
nix    = { workspace = true, features = [ "fs" ] }
tokio  = { workspace = true, features = [ "rt", "time", "process", "fs", "io-util", "macros" ] }
