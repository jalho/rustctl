[package]
name    = "rustctl-backend"
version = "0.1.0-rc8"
edition = "2024"

[dependencies]
axum              = { workspace = true, features = [ "ws", "tokio", "http1" ] }
chrono            = { workspace = true, features = [] }
clap              = { workspace = true, features = [ "derive", "std", "help", "usage" ] }
futures           = { workspace = true, features = [] }
futures-util      = { workspace = true, features = [] }
keyvalues-parser  = { workspace = true, features = [] }
libc              = { workspace = true, features = [] }
log               = { workspace = true, features = [] }
log4rs            = { workspace = true, features = [ "console_appender", "file_appender" ] }
nix               = { workspace = true, features = [ "signal" ] }
rand              = { workspace = true, features = [] }
regex             = { workspace = true, features = [ "unicode-perl" ] }
rusqlite          = { workspace = true, features = [ "bundled", "chrono" ] }
rustctl-common    = { workspace = true, features = [] }
serde             = { workspace = true, features = [ "derive" ] }
serde_json        = { workspace = true, features = [ "alloc" ] }
tokio             = { workspace = true, features = [ "fs", "net", "process", "signal" ] }
tokio-tungstenite = { workspace = true, features = [ "connect" ] }
tokio-util        = { workspace = true, features = [] }
tower-http        = { workspace = true, features = [] }
uuid              = { workspace = true, features = [ "v4" ] }
walkdir           = { workspace = true, features = [] }
