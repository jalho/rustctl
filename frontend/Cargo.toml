[package]
name = "rustctl-frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.6.0", features = [] }
futures-util = "0.3.31"
gloo-net = "0.6.0"
reqwest = { version = "0.12.18", features = ["json"] }
reqwest-websocket = "0.5.0"
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.45.1", features = ["time"] }
wasm-bindgen-futures = "0.4.50"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
