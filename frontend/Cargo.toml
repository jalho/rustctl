[package]
name = "rustctl-frontend"
version = "0.1.0"
edition = "2024"

[dependencies.dioxus]
version = "0.6.0"
features = []

[dependencies.futures-util]
version = "0.3.31"
features = ["sink"]

[dependencies.gloo-net]
version = "0.6.0"

[dependencies.serde]
version = "1.0.219"
features = ["derive"]

[dependencies.wasm-bindgen-futures]
version = "0.4.50"

[features]
default = ["web"]
web = ["dioxus/web"]

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
