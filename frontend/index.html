<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>rustctl v{{VERSION}}</title>
    <style>
      body {
        background-color: #121212;
        color: #ffffff;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        gap: 20px;
      }
      form {
        display: flex;
        gap: 10px;
      }
      button,
      input {
        padding: 10px 20px;
        background-color: #333;
        color: white;
        border: 1px solid #555;
        border-radius: 4px;
        font-size: 14px;
      }
      button {
        cursor: pointer;
      }
      button:hover {
        background-color: #444;
      }
      input:focus {
        outline: none;
        border-color: #777;
      }
    </style>
  </head>
  <body>
    <button id="passkey-read">Read Existing Passkey</button>

    <form id="passkey-create-form" action="{{SIGN_UP_CHALLENGE}}" method="POST">
      <input
        type="text"
        name="passkey_name"
        placeholder="Passkey Name"
        required
      />
      <button type="submit">Create New Passkey</button>
    </form>
  </body>
</html>

<script>
  function decode_buffer_from_base64(value) {
    const base64 = value.replace(/-/g, "+").replace(/_/g, "/");
    const binaryString = window.atob(base64);
    const len = binaryString.length;
    const bytes = new Uint8Array(len);
    for (let i = 0; i < len; i++) {
      bytes[i] = binaryString.charCodeAt(i);
    }
    return bytes.buffer;
  }

  async function fetch_opts_passkey_read() {
    const response = await fetch("{{SIGN_IN_CHALLENGE}}", {
      method: "POST",
    });

    const data = await response.json();
    const options = data.rcr.publicKey;
    const challenge_id = data.id;

    options.challenge = decode_buffer_from_base64(options.challenge);

    return { options, challenge_id };
  }

  async function handle_btn_passkey_read() {
    const { options, challenge_id } = await fetch_opts_passkey_read();

    let credential;
    try {
      credential = await navigator.credentials.get({ publicKey: options });
    } catch (err) {
      observe_error(err);
      return;
    }

    const response = await fetch(
      `{{SIGN_IN_SUBMIT}}`.replace("{challenge_id}", challenge_id),
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(credential),
      },
    );
  }

  async function handle_form_passkey_create(event) {
    event.preventDefault();

    const form = event.target;
    const passkey_name = new FormData(form).get("passkey_name");

    const response = await fetch(form.action, {
      method: form.method,
      body: JSON.stringify({ passkey_name }),
      headers: { "Content-Type": "application/json" },
    });

    const data = await response.json();
    const options = data.ccr.publicKey;
    const challenge_id = data.id;

    options.challenge = decode_buffer_from_base64(options.challenge);
    options.user.id = decode_buffer_from_base64(options.user.id);

    let credential;
    try {
      credential = await navigator.credentials.create({ publicKey: options });
    } catch (err) {
      observe_error(err);
      return;
    }

    await fetch(`{{SIGN_UP_SUBMIT}}`.replace("{challenge_id}", challenge_id), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(credential),
    });
  }

  async function observe_error(error) {
    console.error(error);
  }

  function main() {
    const btn_read = document.getElementById("passkey-read");
    btn_read.addEventListener("click", handle_btn_passkey_read);

    const form_create = document.getElementById("passkey-create-form");
    form_create.addEventListener("submit", handle_form_passkey_create);
  }

  main();
</script>
