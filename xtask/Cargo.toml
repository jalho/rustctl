[package]
edition      = "2024"
name         = "xtask"
rust-version = { workspace = true }

[dependencies]
clap       = { workspace = true, default-features = false, features = [ "color", "derive", "error-context", "help", "std", "suggestions", "usage" ] }
log        = { workspace = true, default-features = false, features = [ ] }
log4rs     = { workspace = true, default-features = false, features = [ "console_appender" ] }
serde_json = { workspace = true, default-features = false, features = [ "alloc" ] }
